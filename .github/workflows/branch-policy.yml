name: Branch Policy

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  branch_name:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate branch naming
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python src/interfaces/branch_policy.py \
              --name "${{ steps.branch.outputs.name }}" \
              --target "${{ github.base_ref }}" \
              --json
          else
            python src/interfaces/branch_policy.py --name "${{ steps.branch.outputs.name }}" --json
          fi
