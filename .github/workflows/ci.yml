name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src rede_neural_do_zero

      - name: Run tests
        run: python -m pytest -q --cov=src --cov-report=term-missing

      - name: Validate notebooks
        run: python scripts/validate_notebooks.py

      - name: CLI smoke
        run: |
          python -m rede_neural_do_zero --help
          python -m rede_neural_do_zero train --config configs/train/iris.yaml --save-dir results/ci-train
          python -m rede_neural_do_zero evaluate --config configs/evaluate/diabetes.toml
          python -m rede_neural_do_zero benchmark --datasets iris,diabetes --samples 180 --epochs 40 --seeds 42,52 --output-dir logs/ci-benchmark

      - name: Build docs
        run: python -m rede_neural_do_zero build-docs --strict

      - name: Build package
        run: python -m rede_neural_do_zero build-package --check

      - name: Install wheel smoke
        run: |
          python -m pip install --force-reinstall dist/*.whl
          rede-neural-do-zero --help

