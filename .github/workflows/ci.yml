name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Run tests
        run: python -m pytest -q --cov=src --cov-report=term-missing

      - name: Run deterministic evaluation smoke
        run: python scripts/evaluate.py --seed 42 --epochs 400 --samples 240

      - name: Run benchmark smoke
        run: python scripts/benchmark.py --mode binario --samples 180 --epochs 80
