name: Question
description: Tire uma duvida sobre uso, CLI, datasets ou funcionamento do projeto.
title: "[Question]: "
labels:
  - question
body:
  - type: dropdown
    id: topic
    attributes:
      label: Tema
      options:
        - Instalacao
        - CLI
        - Benchmark
        - Datasets
        - API Python
        - Publicacao e releases
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Pergunta
      description: Descreva sua duvida com o maximo de contexto util.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: O que voce ja tentou
      description: Comandos, paginas lidas ou comportamento observado.
