name: Bug report
description: Reporte um problema reproduzivel no projeto.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area afetada
      description: Escolha a parte principal do projeto impactada.
      options:
        - CLI oficial
        - Benchmark e avaliacao
        - Datasets
        - Documentacao
        - Pacote e build
        - Exemplo ou notebook
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descricao
      description: O que aconteceu e qual era o comportamento esperado?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Inclua comandos, configs, dataset e passos minimos.
      placeholder: |
        1. Rode `python -m src train ...`
        2. Use o config `configs/...`
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Python, sistema operacional e versao do projeto.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validacao adicional
      description: Se ja rodou `python -m src verify`, logs ou prints uteis podem entrar aqui.
